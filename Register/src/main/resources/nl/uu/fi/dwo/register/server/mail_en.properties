mail.body.DEMO=\
Dear {1} {2} {3},\n\
Thank you for requesting a demo account for the Numworx Digital Mathematics Environment. We created a school environment for you, "{5}", and a teacher account that you may use for the next six weeks:\n\
With your teacher account you may create student accounts. Manuals can be found on www.numworx.nl/en/ (see www.numworx.nl/en/support/manuals/).\n\
To confirm your registration and to choose a password go to\n\
{0}\n\
For logging in into Numworx, see https://www.numworx.nl/en/log-in/.\n\
For the teacher environment for authoring you have to install Numworx Author, see https://www.numworx.nl/en/support/downloads/.\n\n\
Kind regards,\n\
Numworx Solutions\n
