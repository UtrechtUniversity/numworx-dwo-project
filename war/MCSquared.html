<script type="text/javascript" language="javascript" >
var $wnd = window;

function getLocale() {
	var locale = "nl"; // FIXME get Locale from Window?
	var  query = $wnd.location.search;
	var k = query.indexOf("locale=");
	if(k >= 0)
	{
		query = query.substring(k+7);
		k = query.indexOf('&');
		if(k > 0) query = query.substring(0, k);
		locale = query;
	}
	return locale;
}


function $(id) {
	return document.getElementById(id)
}
// To be more stringent in adhering to RFC 3986, more reserved characters:
function fixedEncodeURIComponent (str) {
	  return encodeURIComponent(str).replace(/[!'()*]/g, function(c) {
	    return '%' + c.charCodeAt(0).toString(16);
	  });
	}
function signature() {
	var url = $('lti').action;
	console.log("signature for " + url);
	url = encodeURIComponent(url);
	var pfx="POST&" + url + "&";
	var text = ""
	var secret = "secret&";
	var inputs = document.getElementsByTagName("input");
	var b = false;
	var i;
	for( i = 0; i < inputs.length; i++) {
		input = inputs[i]
		if(input.name == 'oauth_signature')
			continue;
		name = encodeURIComponent(input.name);
		value = fixedEncodeURIComponent(input.value);
		if(b) text += "&"
		b = true;
		text += name + "=" + value 
	}
	text = pfx + encodeURIComponent(text)
	$("stub").innerHTML = text;
	
	n = b64_hmac_sha1(secret, text);
	$('oauth_signature').value = n;
}
