<script type="text/javascript">

	function ggbLog(viewer, cmd, label, definition, value, type) {
		console.log("GGB: " , cmd , 
				" o: " , label , 
				" d: " , definition , 
				" v: " , value,
				" t: " , type
		);
	}


	function addListener(obj) {
		ggblog( window.viewer,
				"add", obj, 
				ggbApplet.getDefinitionString(obj),
				ggbApplet.getValueString(obj), 
				ggbApplet.getObjectType(obj))}
	function removeListener(obj) {
		ggbLog("remove", obj, 
				ggbApplet.getDefinitionString(obj),
				ggbApplet.getValueString(obj), 
				ggbApplet.getObjectType(obj))}
//	function clearListener()  {ggbLog("clear", null, null, null, null, null)}
	function renameListener(from,to) {
		ggbLog("rename", obj,
				to,
				ggbApplet.getValueString(obj), 
				ggbApplet.getObjectType(obj))}
				
    function updateListener(obj) {
    	ggbLog( window.viewer,
    			"update", 
    			obj, 
    			ggbApplet.getDefinitionString(obj),
    			ggbApplet.getValueString(obj),
    			ggbApplet.getObjectType(obj)
    	)}
	//function updateObjectListener(obj) {ggbLog("updateObject", obj, obj)}


	function ggbOnInit() {
		//===Js code starts here===//
		var applet = document.ggbApplet
		window.ggbApplet = applet
		try { 
			window.install(applet, window.viewer)
			if ( window.ggbLog ) {
				applet.registerAddListener("addListener")
				applet.registerRemoveListener("removeListener")
				applet.registerUpdateListener("updateListener")
				//applet.registerClearListener("clearListener")
				applet.registerRenameListener("renameListener")
			}
		} catch(err) {
			console.log(err);
		}
	}
	
	function writeGGB() {
		if( window.install ) 
		{
			article_pre = "<article class='geogebraweb' style='border:0px solid black; display:inline-block; margin: 0px;' "
			article_post = "></article>"	
			result = window.install(null, window.viewer)
			document.getElementById('hiero').innerHTML =  ( article_pre + result + article_post );
			web.succeeded = web()
		} else {
			console.log("window.install not defined")
			window.setTimeout("writeGGB()",50);
		}
	}
	window.setTimeout("writeGGB()",50);
</script>
<div id='hiero'>
<article class='geogebraweb' style='border: 1px solid black; display:inline-block;' data-param-language='nl' data-param-ggbbase64=''></article>
