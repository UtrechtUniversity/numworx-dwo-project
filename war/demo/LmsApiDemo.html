<script type="text/javascript">
    var lrs = new ContentApiLrs();
    lrs.setTarget(window.parent, "*");

    function createModuleDatastatement() {
        json = $("#moduledata").val();

        var result = { "verb": { "id": "http://bao.mijnklas.nl/xapi/verbs/moduleData" }, "object": { "objectType": "Activity", "id": "http://bao.mijnklas.nl/xapi/activities/get-moduledata-request" }, "result": { "duration": "PT0S", "extensions": { "http://bao.mijnklas.nl/xapi/extensions/objectType": "json", "http://bao.mijnklas.nl/xapi/extensions/json": json } }, "version": "1.0.1" };
        
        var message = JSON.stringify([result]);
        var win = document.getElementById("iframe");
        win.contentWindow.postMessage(message, "*");
    }

</script>

<script src="demo.js" type="text/javascript"></script>

<div class="config">

<form action="." method="post">            <span>Exercise Url</span>

			<!-- Placed at the end of the document so the pages load faster -->
			

		<script>
		    var path = '';
		    var currentPath = document.location.pathname;
		    var xapiIndex = currentPath.indexOf('/xapi');
		    if (xapiIndex > -1) {
		        path = currentPath.substr(0, xapiIndex + '/xapi'.length);
		    }

		    var localXApiPath = '//' + document.location.host + path;

		    console.debug(document.location);
		    $('a[href^="http://bao.mijnklas.nl/xapi"]').each(function() {
		        var $this = $(this);
		        var href = $this.attr('href');
		        href = href.replace('http://bao.mijnklas.nl/xapi', localXApiPath);

		        $this.attr('href', href);
		    });
		</script>
