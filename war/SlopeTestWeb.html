	function ggbOnInit() {
		//===Js code starts here===//

			result = window.install(applet, window.viewer)
		} catch(err) {

		}
	}
	
	function writeGGB() {
		article_pre = "<article class='geogebraweb' style='border:0px solid black; display:inline-block; margin: -10px;' data-param-ggbbase64='"
		article_post = "'></article>"	
		result = window.install(null, window.viewer)
		document.getElementById('hiero').innerHTML =  ( article_pre + result + article_post );
		web.succeeded = web()
	}
	
	window.setTimeout("writeGGB()",1000);
</script>
