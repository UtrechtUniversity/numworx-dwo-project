welcomeText=<h1>Welkom Docent!</h1>\
<p>In het menu aan de linkerkant van het scherm vindt u de hoofdsecties van dit programma.\
<p>Bent u docent? Dan heeft u via <a href="#RESULTS"><b>Resultaten</b></a> direct toegang tot de resultaten van uw klassen voor de toegekende modules.\
<p>In <a href="#PERSONS"><b>Personen</b></a> voegt u leerlingen/studenten en docenten toe aan klassen en bewerkt u de gegevens van individuele personen.\
<p>In de sectie <a href="#SCHOOLCLASSES">Klassen</a> maakt u klassen aan en koppelt u deze aan leerlingen, docenten en modules.\
<p>In <a href="#MODULES"><b>Modules</b></a> vindt u alle modules die voor uw instelling beschikbaar zijn.\
<p style='display:none'> Bent u SchoolAdmin? Dan heeft u toegang tot speciale functies in de sectie <a href="#ORGANISATION"><b>Organisatie</b></a>.</p>\
<p>Uw persoonlijke <a href="#ACCOUNT"><b>Account beheren</b></a>, vindt u rechtsboven in het scherm.\
<h1> Belangrijk! </h1>\
<p>Met deze webapplicatie kun u geen nieuwe modules en activiteiten maken of bestaande modules en activiteiten aanpassen. Hiervoor moet u Numworx Author gebruiken. Numworx Author kan <a href="/downloads/" target="_blank"><b>hier</b></a> worden gedownload.</p>
unsealText: Let op! Bij ontzegelen van een activiteit worden alle gemaakte correcties verwijderd!
