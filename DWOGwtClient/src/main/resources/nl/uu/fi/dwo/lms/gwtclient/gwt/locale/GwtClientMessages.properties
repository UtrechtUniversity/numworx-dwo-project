welcomeText=<h1>Welcome at Numworx Teacher!</h1><p>In the menu on the lefthand side of the screen you can find the main sections of this program.<p>Are you a teacher? Via <a href="#RESULTS"><b>Results</b></a> you have direct access to the results of your classes for the assigned modules.<p>In <a href="#PERSONS"><b>Persons</b></a> you assign teachers and students to classes and edit their individual data.<p> In the section <a href="#SCHOOLCLASSES">Classes</a> you create classes and assign students, teachers and modules to it.<p>In <a href="#MODULES"><b>Modules</b></a> you find all modules available to your institution.<p style='display:none'> You can find <a href="#ACCOUNT"><b>account management</b></a>, in the upper right corner of your screen. <br/><h1> Important! </h1><p>This web application does not support the creating of new modules and activities or changing existing content. For this you need Numworx Author that can be downloaded <a href="/downloads/" target="_blank"><b>here</b></a>.</p>

