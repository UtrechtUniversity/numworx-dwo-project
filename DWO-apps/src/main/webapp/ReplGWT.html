<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<script type="text/javascript" src='deploy.jsp'></script>

    <!--                                                               -->
    <!-- Consider inlining CSS to reduce the number of requested files -->
    <!--                                                               -->
    <script>css("ReplGWT.css")</script>

    <!--                                           -->
    <!-- Any title is fine                         -->
    <!--                                           -->
    <title>Repl</title>
	<script type="text/javascript" src="https://cdn.jsdelivr.net/pyodide/v0.23.3/full/pyodide.js" ></script>

<script type="text/javascript">

async function main(input, out) {
	var options = { }
	options.stdout = function(text) { 
		out.innerHTML = out.innerHTML + text + "\n"
	};
	options.stderr = options.stdout
	options.stdin =  window.prompt
	
  	let pyodide = await loadPyodide(options);
  // Pyodide is now ready to use...
	  try {
		    var result = pyodide.runPython(input)
		  	if (result) out.innerHTML = out.innerHTML + "\n\n" + result;
		  } catch (e) {
			  out.innerHTML = out.innerHTML + "\n\n" + e.toString();
		  }
};


function runit(prog) { 
   var mypre = document.getElementById("output"); 
   mypre.innerHTML = ''; 
   main(prog, mypre)
} 

</script>

	<pre id="output" ></pre>
