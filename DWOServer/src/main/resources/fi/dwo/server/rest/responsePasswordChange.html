<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style type="text/css">
@import url("https://cdn.dwo.nl/apps/css/ubuntu.css");
body '{'
	height: 100%;
	width: 100%;
	background-color: #8ebee5 !important;
	margin: 0px !important;
}
#header '{'
	background-color: #314770;
	color: #8eBee5;
	font-size: 16pt;
	font-weight: bold;
	font-family: "Ubuntu" !important;
	display: flex;
	height: 50px;
}
#header p '{'
	margin: auto;
}
#body '{'
	width: 450px;
	display: block;
	margin: 20px auto; 
	border: solid black 1px;
	background-color: #314770;
	padding: 10px
}

#body td '{'
	font-family: Ubuntu, sans-serif !important;
	font-size: 18px;
	color: white;
}

a button '{'
	color: white;
	background-color: #1B75BB;
	height: 26px;
	width: 126px;
	right: 25px;
	font-size: 12px;
	font-family: Ubuntu;
	font-weight: bold;
	letter-spacing: 2px;
	-webkit-border-radius: 4px;
	-moz-border-radius: 4px;
	border: 2px #1B75BB solid;
	text-transform: uppercase;
    border-top-left-radius: 4px;
    border-top-right-radius: 4px;
    border-bottom-right-radius: 4px;
	border-bottom-left-radius: 4px;
	display: inline-block;
	text-align: center;
	text-decoration-line: none;
}

</style>
</head>
<body>
<div id="header">
	<p>{3}</p>
</div>
<div id=body>
		<table>
			<tr><td colspan="2">{0}</td></tr>
			<tr><td>&nbsp;</td></tr>
			<tr><td>&nbsp;</td></tr>
			<tr><td></td><td align="right"><a href="{1}"><button>{2}</button></a></td></tr>
		<table>
</div>
</body>
</html>
