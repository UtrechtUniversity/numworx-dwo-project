<html>
<head>
<title>Digitale Wiskunde Omgeving</title>
<script language="Javascript">

function StartShow() 
{	
leftVal = (screen.width - 1280) / 2;
topVal = (screen.height - 800) / 2;
dwo= window.open('frameset.html','dwo','toolbar=no,location=no,directories=no,status=no,menubar=no,scrollbars=no,resizable=yes,width=1280,height=800,left='+leftVal+',top='+topVal);
dwo.focus();	
}
</script>
</head>

<body onload="StartShow()">
<p>
Als er geen nieuw window verschijnt met de DWO, klik dan <a  href="frameset.html">
hier</a>.
</p>
</body>
</html>
