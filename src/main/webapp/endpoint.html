<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<div id='result'></div>
<script>
var verifier = window.parent.getItem("code_verifier");
var token = "/dwo/saml/login";

token = "/dwox/rest/oauth2/token";

document.write(verifier);
document.write(" ")
code = window.location.search.substring(3);
code = decodeURIComponent(code);
// if code == parent
code = window.parent.getItem("code");
document.write(code)
var antw = { };

clientId= window.parent.clientId;

                var xhr = new XMLHttpRequest();

                xhr.onload = function() {
                    var response = null;
                    if (xhr.readyState == 4) {
                    	response = xhr.response
                    }
                    var message;

                    if (xhr.status == 200) {
                        antw = response;
                        message = "Access Token: " + JSON.stringify(response);
                    }
                    else {
                        message = "Error: "+ JSON.stringify(response); ;//+ response.error_description + " (" + response.error + ")";
                    }

                    document.getElementById("result").innerHTML = message;
                };
                xhr.responseType = 'json';
                xhr.open("POST", token, true);
                xhr.setRequestHeader('Content-type', 'application/x-www-form-urlencoded');
                xhr.send(new URLSearchParams({
                    client_id: clientId,
                    code_verifier: verifier,
                    grant_type: "authorization_code",
                    redirect_uri: window.parent.location.href.replace(location.search, ''),
                    code: code
                }));

function doehet() {
               var xhr = new XMLHttpRequest();

                xhr.onload = function() {
                    var response = null;
                    if (xhr.readyState == 4) {
                    	response = xhr.response
                    }
                    var message;

                    if (xhr.status == 200) {
                        message = "Response: " + JSON.stringify(response);
                    }
                    else {
                        message = "Error: "+ JSON.stringify(response); ;//+ response.error_description + " (" + response.error + ")";
                    }

                    document.getElementById("result").innerHTML = message;
                };
                xhr.responseType = 'json';
                xhr.open("GET", "/dwox/rest/secure/user/account/get", true);
                var authz = antw.token_type + " " + antw.access_token;
                console.log(authz)
                xhr.setRequestHeader('Authorization', authz);
                xhr.send();
}
function refresh() {
              var xhr = new XMLHttpRequest();

                xhr.onload = function() {
                    var response = null;
                    if (xhr.readyState == 4) {
                    	response = xhr.response
                    }
                    var message;

                    if (xhr.status == 200) {
                        message = "Response: " + JSON.stringify(response);
                    }
                    else {
                        message = "Error: "+ JSON.stringify(response); ;//+ response.error_description + " (" + response.error + ")";
                    }

                    document.getElementById("result").innerHTML = message;
                };
                xhr.responseType = 'json';
                xhr.open("GET", "dwo-redirect", true);
                var authz = antw.token_type + " " + antw.access_token;
                console.log(authz)
                xhr.setRequestHeader('Authorization', authz);
                xhr.send();
}

</script>
<br>
<button onclick='doehet()' >button</button><br>
<button onclick='refresh()'>refresh</button>
</body>
</html>
