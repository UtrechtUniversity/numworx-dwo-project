no\ hint\ available = You are finished.

check.samplemean = Correct the error in the sample mean. The sample mean is the sum of the sample values, divided by the number of values. 
check.populationsdev = Correct the error in the standard deviation. The population standard deviation is given. Because it is a population parameter, we denote it with a Greek character.  
check.samplesdev = Correct the error in the standard deviation. If necessary, look up how the sample standard deviation can be calculated. Because it is a sample characteristic, we do not use Greek characters.
check.samplesize = Correct the error in sample size. The sample size is given or can be inferred from the given information. 
check.correlation = Correct the error in the correlation coefficient. This is given or can be inferred from the given information.   
check.alpha = Correct the error in the significance level. It is given in the task. 
check.h0 = Adjust your null hypothesis to better match with the claim from the task or with the alternative hypothesis. The null hypothesis concerns the population (not the sample) and assumes there is no difference or effect. 
check.h0\:\ parameter\ mismatch = Adjust your null hypothesis. The hypotheses in a hypothesis test concern a parameter in the population, which we denote with Greek characters. 
check.h0\:\ value\ mismatch = Adjust your null hypothesis. The null hypothesis describes the situation in which there is no difference or effect. The hypothesis (expectation) is therefore that the population mean corresponding to the sample is equal to the already known population mean.   
check.h0\:\ sign\ mismatch = Adjust your null hypothesis. The null hypothesis and alternative hypothesis describe to different situations; therefore the null hypothesis should state exactly the opposite of the alternative hypothesis.   
check.h0\:\ component\ is\ not\ of\ type\ relation = Your null hypothesis is incomplete. The null hypothesis concerns the population (not the sample) and assumes that there is no difference or effect. 
check.ha = Adjust your alternative hypothesis to better match with the claim from the task. The alternative hypothesis concerns the population (not the sample) and assumes that there is a difference or effect.  
check.ha\:\ parameter\ mismatch = Adjust your alternative hypothesis. The hypotheses in a hypothesis test concern a parameter in the population, which we denote with Greek characters. 
check.ha\:\ value\ mismatch = Adjust your alternative hypothesis. The alternative hypothesis describes the situation in which there is a difference or effect compared to the known population. Therefore, in the alternative you compare something with the known population. 
check.ha\:\ sign\ mismatch = Adjust your alternative hypothesis. Make sure the direction (the sign) matches with the claim from the task. 
check.ha\:\ component\ is\ not\ of\ type\ relation = Your alternative hypothesis is incomplete. The alternative hypothesis concerns the population and assumes that there is a difference or effect.  
check.sided = Correct the direction of the test (one sided or two sided), so that it matches with the hypotheses or the claim from the task.
check.sided\:\ anova = Correct the error in the direction of the test. In an ANOVA you are interested in whether the F-ratio is extraordinary large, so the test is always one sided, right tail.
check.sided\:\ chi-squared = Correct the error in the direction of the test. In a Chi-squared test your are interested in whether the value of Chi-squared is extraordinary large, so the test is always one sided, right tail.  
check.test = Adjust your test choice, to better match the task.  
check.test-formula = Correct your error in the formula of the test statistic. For example, check whether the population standard deviation is known, or whether you have to estimate it based on the sample.  
check.test-formula\:\ component\ is\ not\ of\ type\ relation = Finish the formula of the test statistic. For example, consider whether the population standard deviation is known, or whether you have to estimate it based on the sample.
check.test-formula\:\ cannot\ solve = Correct your error in the formula of the test statistic. For example, check whether the population standard deviation is known, or whether you have to estimate it based on the sample.
check.test-formula\:\ no\ match = Correct your error in the formula of the test statistic. For example, check whether the population standard deviation is known, or whether you have to estimate it based on the sample.
check.test-formula\:\ test\ mismatch = Correct your error in the formula of the test statistic. Make sure the left hand side corresponds with the type of test you are doing. 
check.test-value = Correct your error in the value of the test statistic. If necessary, look up the formula of the test statistic.  
check.test-value\:\ no\ match = Correct your error in the value of the test statistic. If necessary, look up the formula of the test statistic.  
check.test-value\:\ test\ mismatch = Correct the left hand side of the test statistic. Make sure the variable name corresponds with the type of test you are doing. 
check.test-value\:\ component\ is\ not\ of\ type\ relation = Complete the test statistic. If necessary, look up the formula of the test statistic.
check.test-value\:\ almost\ equal = Correct the error in the value of the test statistic. You are close, make sure to only round off at the end and not in between calculations.  
check.df = Correct your error in the number of degrees of freedom. If necessary, look up how to find the number of degrees of freedom for the type of test you are doing.  
check.df\:\ no\ match =  Correct your error in the number of degrees of freedom. If necessary, look up how to find the number of degrees of freedom for the type of test you are doing.
check.df-anova =  Correct your error in the number of degrees of freedom. If necessary, look up how to find the number of degrees of freedom for an ANOVA.
check.df-anova\:\ df-between = Correct your error in the number of degrees of freedom between groups. This is equal to the number of groups - 1. 
check.df-anova\:\ df-within = Correct your error in the number of degrees of freedom within groups. This is equal to the number of sample values in all groups together - the number of groups.   
check.df-anova\:\ no\ match = Correct your error in the number of degrees of freedom. If necessary, look up how to find the number of degrees of freedom for an ANOVA. 
check.critical = Correct your error in the critical value. Make sure you have all relevant information (significance level, possibly degrees of freedom, type of test, one sided or two sided) and check which table you need to use. 
check.critical\:\ alternative\ hypothesis\ missing = You have found a critical value, but you did not state hypotheses yet. Remove the critical value for now and first try to state hypotheses that you can test.  
check.critical\:\ test\ mismatch = Correct your error in the critical value. Make sure the left hand side matches with the type of test you are doing.  
check.critical\:\ component\ is\ not\ of\ type\ relation = The critical value is not yet complete. Make sure you have all relevant information (significance level, possibly degrees of freedom, type of test, one sided or two sided) and check which table you need to use.
check.critical\:\ almost\ equal = Correct your error in the critical value. You are close, make sure to use enough decimals. 
check.rejectioncritical = Correct your error in the rejection region. If necessary, look up which distribution corresponds with your null hypothesis and type of test and consider how the direction of the alternative hypothesis relates to the position of the rejection region.  
check.rejectioncritical\:\ test\ mismatch = Correct your error in the rejection region. Make sure the name of the variable corresponds with the type of test you are doing.  
check.rejectioncritical\:\ sidedness\ mismatch = Correct your error in the rejection region. If the alternative hypothesis has a specific direction (left sided or right sided), then the rejection region also lies on the leftmost or rightmost part of the distribution under the null hypothesis. 
check.rejectioncritical\:\ anova\ mismatch = Correct your error in the rejection region. Remember that in an ANOVA you are always interested in whether the F-ratio is extraordinary large. Therefore, the rejection region always lies on the right hand side of the F-distribution.  
check.rejectioncritical\:\ chi-squared\ mismatch = Correct your error in the rejection region. Remember that in a Chi-squared test you are always interested in whether the value of Chi-squared is extraordinary large. Therefore, the rejection region always lies on the right hand side of the distribution.  
check.rejectioncritical\:\ alternative\ hypothesis\ missing = You have defined a rejection region, but you did not state hypotheses yet. Remove the rejection region for now and first try to state hypotheses that you can test. 
check.rejectioncritical\:\ component\ is\ not\ of\ type\ relation = Your rejection region is incomplete. If necessary, look up which distribution corresponds with your null hypothesis and type of test and consider how the direction of the alternative hypothesis relates to the position of the rejection region.
check.p-value = Correct your error in the p-value. Make sure that you know how to describe the distribution under the null hypothesis (is it a normal distribution, t-distribution or another distribution and do you need degrees of freedom?) and use an appropriate (online) tool to find the p-value. 
check.p-value\:\ TestValue\ missing = The p-value is the probability of a value at least as extreme as the value of the test statistic, in the distribution under the null hypothesis. Therefore, you first need to know what the test statistic is, before you can determine the p-value. Remove the p-value for now and first try to find the test statistic.  
check.p-value\:\ alternative\ hypothesis\ missing = The p-value is the probability of a value at least as extreme as the value of the test statistic, in the distribution under the null hypothesis. Therefore, you first need a null hypothesis before you can determine the p-value. Remove the p-value for now and first state hypotheses. 
check.p-value\:\ component\ is\ not\ of\ type\ relation = Something went wrong with the p-value. Try to fill it in again, or remove the step and add it again. 
check.p-value\:\ value\ not\ a\ probability = Correct your error in the p-value. The p-value is a probability: the probability of a value at least as extreme as the value of the test statistic, in the distribution under the null hypothesis. Did you indeed fill in a probability (a number between 0 and 1)? 
check.p-value\:\ almost\ equal = Correct your error in the p-value. You are close, make sure to use enough decimals. 
check.conclusion.p-value = Correct your statement about the p-value and significance level.  
check.conclusion.p-value\:\ PValue\ missing = You try to compare the p-value with the significance level, but have not given a p-value yet. First try to find the p-value.  
check.conclusion-critical = Correct your statement about the test statistic and rejection region. 
check.conclusion-critical\:\ RejectionCritical\ missing = You try to compare the test statistic with the rejection region, but have not given a rejection region yet. First specify the rejection region. 
check.conclusion-critical\:\ no\ match = You try to compare the test statistic with the rejection region, but have not given the test statistic and/or the critical value. Remove this step for now and first try to find those.  
check.conclusion-hypotheses = You try to draw a conclusion about your hypotheses, but you don't have enough information yet. Remove this step for now, and first try to find a critical value or p-value.  
check.conclusion-hypotheses\:\ conclusion\ mismatch\ critical = Correct the error in your conclusion. Does the test statistic fall in the rejection region? And how does this influence your final conclusion?  
check.conclusion-hypotheses\:\ conclusion\ mismatch\ pvalue = Correct the error in your conclusion. Is the p-value smaller or larger than the significance level? And how does this influence your final conclusion? 
check.conclusion-hypotheses\:\ convention\ DontRejectH0 = Correct the error in your conclusion. Make sure you make a statement about $fH$s0@.@ 
check.conclusion-hypotheses\:\ convention\ RejectH0 = Correct the error in your conclusion. Make sure you make a statement about $fH$s0@.@
check.standard-error = Correct the error in your standard error. The standard error is the standard deviation of the distribution of the sample mean. You can calculate the standard error by dividing the standard deviation (which you know in the population or calculate from the sample) by the square root of the sample size.  
check.standard-error\:\ component\ is\ not\ of\ type\ relation = Complete the standard error. The standard error is the standard deviation of the distribution of the sample mean. You can calculate the standard error by dividing the standard deviation (which you know in the population or calculate from the sample) by the square root of the sample size.   
check.standard-error\:\ standard\ error\ mismatch = Correct the left hand side of the standard error. If you can use the standard deviation in the population to calculate the standard error, we denote the standard error with a Greek character. If you have to estimate the standard deviation from the sample, we do not use Greek characters.  
check.standard-error\:\ almost\ equal = Correct the error in the standard error. You are close, make sure to use enough decimals.  
check.groups = Correct the error in the number of groups, which can be found based on the information in the task.  
check.observed-totals\:\ rows = Correct the error in the totals of observed frequencies. These can be calculated from the information in the task.  
check.observed-totals\:\ columns = Correct the error in the totals of observed frequencies. These can be calculated from the information in the task. 
check.observed-totals:\:\ total = Correct the error in the totals of observed frequencies. These can be calculated from the information in the task. 
check.expected-frequencies = Correct the error in the expected frequencies. If necessary, look up how to calculate them.   