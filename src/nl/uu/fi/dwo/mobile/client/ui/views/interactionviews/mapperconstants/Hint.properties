check.samplemean = Verbeter het steekproefgemiddelde. Het steekproefgemiddelde is de som van de waarden in de steekproef, gedeeld door het aantal waarden. 
check.populationsdev = Verbeter de standaardafwijking. De standaardafwijking in de populatie is gegeven. Omdat het om gegevens over de populatie gaat, duiden we dit aan met een Griekse letter. 
check.samplesdev = Verbeter de standaardafwijking. Zoek nog eens op hoe je de standaardafwijking van de steekproef berekent. Omdat het om gegevens van de steekproef gaat, duiden we dit niet aan met een Griekse letter.
check.samplesize = Verbeter de steekproefgrootte. Deze is gegeven in de opgave of af te leiden uit de gegevens.
check.correlation = Verbeter de correlatiecoefficient. Deze is gegeven in de opgave of af te leiden uit de gegevens.  
check.alpha = Verbeter het significantieniveau. Dit is gegeven in de opgave.
check.h0 = Verbeter je nulhypothese zodat hij aansluit bij de claim in de opdracht of bij je alternatieve hypothese. De nulhypothese gaat over de populatie (niet over de steekproef) en gaat ervan uit dat er geen verschil of effect is.
check.h0\:\ parameter\ mismatch = Verbeter je nulhypothese. De hypotheses in een hypothesetoets gaan over een parameter in de populatie. Die duiden we aan met Griekse letters.
check.h0\:\ value\ mismatch = Verbeter je nulhypothese. De nulhypothese beschrijft de situatie waarin er geen verschil of effect is. De hypothese (verwachting) is dus dat het populatiegemiddelde dat hoort bij de steekproef gelijk is aan het al bekende populatiegemiddelde.  
check.h0\:\ sign\ mismatch = Verbeter je nulhypothese. De nulhypothese en alternatieve hypothese beschrijven twee verschillende situaties; de nulhypothese moet dus precies het tegenovergestelde zeggen van de alternatieve hypothese.  
check.h0\:\ component\ is\ not\ of\ type\ relation = Je nulhypothese is nog niet compleet. De nulhypothese gaat over de populatie (niet over de steekproef) en gaat ervan uit dat er geen verschil of effect is.
check.ha = Verbeter je alternatieve hypothese zodat hij aansluit bij de claim uit de opdracht. De alternatieve hypothese gaat over de populatie (niet over de steekproef) en gaat ervan uit dat er een verschil of effect is. 
check.ha\:\ parameter\ mismatch = Verbeter je alternatieve hypothese. De hypotheses in een hypothesetoets gaan over een parameter in de populatie. Die duiden we aan met Griekse letters.
check.ha\:\ value\ mismatch = Verbeter je alternatieve hypothese. De alternatieve hypothese beschrijft de situatie waarin er een verschil of effect is ten opzichte van de al bekende populatie. In de alternatieve hypothese vergelijk je dus iets met de al bekende populatie. 
check.ha\:\ sign\ mismatch = Verbeter je alternatieve hypothese. Zorg dat de richting (het teken) past bij de claim in de opdracht.
check.ha\:\ component\ is\ not\ of\ type\ relation = Je alternatieve hypothese is nog niet compleet. De alternatieve hypothese gaat over de populatie (niet over de steekproef) en gaat ervan uit dat er een verschil of effect is.  
check.sided = Verbeter de toetsrichting, zodat deze past bij de hypotheses of claim uit de opdracht.
check.sided\:\ anova = Verbeter de toetsrichting. In een ANOVA wil je weten of de F-ratio uitzonderlijk groot is, dus toets je altijd rechtszijdig.
check.sided\:\ chi-squared = Verbeter de toetsrichting. In een Chi-kwadraattoets wil je weten of de waarde van Chi-kwadraat uitzonderlijk groot is, dus toets je altijd rechtszijdig. 
check.test = Verbeter je toetskeuze, zodat deze beter past bij de opgave. 
check.test-formula = Verbeter de formule van de toetsingsgrootheid. Controleer bijvoorbeeld of de populatiestandaardafwijking bekend is, of dat je deze moet schatten op basis van de steekproef. 
check.test-formula\:\ component\ is\ not\ of\ type\ relation = Maak de formule van de toetsingsgrootheid af. Bedenk hierbij bijvoorbeeld of de populatiestandaardafwijking bekend is, of dat je deze moet schatten op basis van de steekproef.
check.test-formula\:\ cannot\ solve = Verbeter de formule van de toetsingsgrootheid. Controleer bijvoorbeeld of de populatiestandaardafwijking bekend is, of dat je deze moet schatten op basis van de steekproef.
check.test-formula\:\ no\ match = Verbeter de formule van de toetsingsgrootheid. Controleer bijvoorbeeld of de populatiestandaardafwijking bekend is, of dat je deze moet schatten op basis van de steekproef.
check.test-formula\:\ test\ mismatch = Verbeter de formule van de toetsingsgrootheid. Zorg dat de linkerkant past bij de toets die je uitvoert.
check.test-value = Verbeter de waarde van de toetsingsgrootheid. Zoek eventueel eerst de juiste formule op. 
check.test-value\:\ no\ match = Verbeter de waarde van de toetsingsgrootheid. Zoek eventueel eerst de juiste formule op. 
check.test-value\:\ test\ mismatch = Verbeter de linkerkant van de toetsingsgrootheid. Zorg dat de naam van de variabele past bij de toets die je uitvoert.
check.test-value\:\ component\ is\ not\ of\ type\ relation = Vul de toetsingsgrootheid verder in. Zoek eventueel eerst de juiste formule op.
check.test-value\:\ almost\ equal = Verbeter de waarde van de toetsingsgrootheid; je zit al in de buurt. Zorg dat je alleen aan het eind afrondt en niet tussentijds. 
check.df = Verbeter het aantal vrijheidsgraden. Zoek eventueel op hoe je het aantal vrijheidsgraden bepaalt voor de toets die je aan het doen bent. 
check.df\:\ no\ match = Verbeter het aantal vrijheidsgraden. Zoek eventueel op hoe je het aantal vrijheidsgraden bepaalt voor de toets die je aan het doen bent. 
check.df-anova = Verbeter het aantal vrijheidsgraden. Zoek eventueel op hoe je het aantal vrijheidsgraden bepaalt voor een ANOVA. 
check.df-anova\:\ df-between = Verbeter het aantal vrijheidsgraden tussen groepen. Dit is gelijk aan het aantal groepen - 1.
check.df-anova\:\ df-within = Verbeter het aantal vrijheidsgraden binnen groepen. Dit is gelijk aan het aantal steekproefwaarden in alle groepen samen - het aantal groepen.  
check.df-anova\:\ no\ match = Verbeter het aantal vrijheidsgraden. Zoek eventueel op hoe je het aantal vrijheidsgraden bepaalt voor een ANOVA. 
check.critical = Verbeter de kritieke waarde. Zorg dat je alle nodige informatie weet (significantieniveau, eventueel vrijheidsgraden, welke toets, een- of tweezijdig) en ga na welke tabel je moet gebruiken.
check.critical\:\ alternative\ hypothesis\ missing = Je hebt al een kritieke waarde bepaald, maar nog geen hypotheses opgesteld. Haal de kritieke waarde nog even weg en probeer eerst hypotheses op te stellen die je kunt toetsen. 
check.critical\:\ test\ mismatch = Verbeter de kritieke waarde. Zorg dat de linkerkant past bij de toets die je uitvoert. 
check.critical\:\ component\ is\ not\ of\ type\ relation = De kritieke waarde is nog niet compleet. Zorg dat je alle nodige informatie (significantieniveau, eventueel vrijheidsgraden, welke toets, een- of tweezijdig) weet en ga na welke tabel je moet gebruiken om de kritieke waarde op te zoeken.
check.critical\:\ almost\ equal = Verbeter de kritieke waarde, je zit al in de buurt. Zorg dat je correct en op voldoende decimalen afrondt.
check.rejectioncritical = Verbeter het kritieke gebied. Zoek eventueel op welke verdeling er hoort bij de nulhypothese en toets die je uitvoert en bedenk of de richting van de alternatieve hypothese invloed heeft op het kritieke gebied. 
check.rejectioncritical\:\ test\ mismatch = Verbeter het kritieke gebied. Zorg dat de variabelenaam past bij de toets die je uitvoert. 
check.rejectioncritical\:\ sidedness\ mismatch = Verbeter het kritieke gebied. Als je alternatieve hypothese een specifieke richting heeft (links- of rechtszijdig) dan ligt het kritieke gebied ook aan de linker of rechterkant van de verdeling onder de nulhypothese.
check.rejectioncritical\:\ anova\ mismatch = Verbeter het kritieke gebied. Bedenk dat je bij een ANOVA altijd wil weten of de F-waarde uitzonderlijk groot is. Het kritieke gebied ligt dus altijd aan de rechterkant van de F-verdeling. 
check.rejectioncritical\:\ chi-squared\ mismatch = Verbeter het kritieke gebied. Bedenk dat je bij een Chi-kwadraattoets altijd wil weten of de waarde van Chi-kwadraat uitzonderlijk groot is. Het kritieke gebied ligt dus altijd aan de rechterkant van de verdeling.
check.rejectioncritical\:\ alternative\ hypothesis\ missing = Je hebt een kritiek gebied bepaald, maar nog geen hypotheses opgesteld. Haal het kritieke gebied nog even weg en probeer eerst hypotheses op te stellen die je kunt toetsen.
check.rejectioncritical\:\ component\ is\ not\ of\ type\ relation = Je kritieke gebied is nog niet compleet. Zoek eventueel op welke verdeling er hoort bij de nulhypothese en toets die je uitvoert en bedenk of de richting van de alternatieve hypothese invloed heeft op het kritieke gebied. 
check.p-value = Verbeter de p-waarde. Zorg dat je weet hoe je de verdeling onder de nulhypothese moet beschrijven (bekijk je een z-verdeling, t-verdeling of nog een andere verdeling en heb je vrijheidsgraden nodig?) en gebruik een geschikte (online) tool om de p-waarde te bepalen. 
check.p-value\:\ TestValue\ missing = De p-waarde geeft aan hoe groot de kans is op een waarde minstens zo extreem als de waarde van de toetsingsgrootheid, in de verdeling onder de nulhypothese. Je moet dus weten wat de toetsinsgrootheid is om de p-waarde te kunnen bepalen. Haal de p-waarde nog even weg en bepaal eerst de toetingsgrootheid. 
check.p-value\:\ alternative\ hypothesis\ missing = De p-waarde geeft aan hoe groot de kans is op een waarde minstens zo extreem als de waarde van de toetsingsgrootheid, in de verdeling onder de nulhypothese. Je moet dus weten wat de nulhypothese is om de p-waarde te kunnen bepalen. Haal de p-waarde nog even weg en stel eerst hypotheses op.
check.p-value\:\ component\ is\ not\ of\ type\ relation = Er is iets fout gegaan met de p-waarde. Vul deze nogmaals in, of haal de stap even weg en doe hem opnieuw.
check.p-value\:\ value\ not\ a\ probability = Verbeter de p-waarde. De p-waarde is de overschrijdingskans: de kans op een waarde minstens zo extreem als de waarde van de toetsingsgrootheid, in de verdeling onder de nulhypothese. Heb je inderdaad een kans (een getal tussen 0 en 1) bepaald?
check.p-value\:\ almost\ equal = Verbeter de p-waarde, je zit al in de buurt. Zorg dat je correct en op voldoende decimalen afrondt.
check.conclusion.p-value = Verbeter je bewering over de p-waarde en het significantieniveau. 
check.conclusion.p-value\:\ PValue\ missing = Je probeert de p-waarde al te vergelijken met het significantieniveau, maar weet nog niet wat de p-waarde is. Probeer eerst de p-waarde te vinden. 
check.conclusion-critical = Verbeter je bewering over de toetsingsgrootheid en het kritieke gebied.
check.conclusion-critical\:\ RejectionCritical\ missing = Je probeert de toetsingsgrootheid met het kritieke gebied te vergelijken, maar weet nog niet wat het kritieke gebied is. Bepaal dit eerst. 
check.conclusion-critical\:\ no\ match = Je probeert de toetsingsgrootheid met het kritieke gebied te vergelijken, maar weet nog niet precies wat de toetsingsgrootheid en/of de kritieke waarde zijn. Haal deze stap nog even weg en probeer daar eerst achter te komen. 
check.conclusion-hypotheses = Je probeert al een conclusie over je hypotheses te trekken, maar hebt nog niet genoeg informatie. Haal deze stap nog even weg en ga eerst een kritieke waarde of p-waarde bepalen. 
check.conclusion-hypotheses\:\ conclusion\ mismatch\ critical = Verbeter je conclusie. Ligt de toetsingsgrootheid in het kritieke gebied of niet? En welke conclusie trek je op basis daarvan? 
check.conclusion-hypotheses\:\ conclusion\ mismatch\ pvalue = Verbeter je conclusie. Is de p-waarde groter of kleiner dan het significantieniveau? En welke conclusie trek je op basis daarvan?
check.conclusion-hypotheses\:\ convention\ DontRejectH0 = Verbeter je conclusie. Zorg dat je een uitspraak doet over $fH$s0@.@ 
check.conclusion-hypotheses\:\ convention\ RejectH0 = Verbeter je conclusie. Zorg dat je een uitspraak doet over $fH$s0@.@
check.standard-error = Verbeter de standaardfout. De standaardfout is de standaardafwijking van de verdeling van het steekproefgemiddelde. Je berekent de standaardfout door de standaardafwijking (die je kent uit de populatie, of uit de steekproef) te delen door de wortel van de steekproefgrootte. 
check.standard-error\:\ component\ is\ not\ of\ type\ relation = Vul de standaardfout aan. De standaardfout is de standaardafwijking van de verdeling van het steekproefgemiddelde. Je berekent de standaardfout door de standaardafwijking (die je kent uit de populatie, of uit de steekproef) te delen door de wortel van de steekproefgrootte. 
check.standard-error\:\ standard\ error\ mismatch = Verbeter de linkerkant van de standaardfout. Als je de standaardfout kunt baseren op de standaardafwijking uit de populatie, dan noteren we ook de standaardfout met een Griekse letter. Als je een schatting maakt op basis van de steekproefstandaardafwijking, dan gebruiken we geen Griekse letter. 
check.standard-error\:\ almost\ equal = Verbeter de standaardfout, je zit al in de buurt. Zorg dat je correct en op voldoende decimalen afrondt. 
check.groups = Verbeter het aantal groepen, dit kun je afleiden uit de gegevens in de opdracht. 
check.observed-totals\:\ rows = Verbeter de totalen van de geobserveerde frequenties. Deze kun je afleiden uit de gegevens in de opdracht. 
check.observed-totals\:\ columns = Verbeter de totalen van de geobserveerde frequenties. Deze kun je afleiden uit de gegevens in de opdracht. 
check.observed-totals:\:\ total = Verbeter de totalen van de geobserveerde frequenties. Deze kun je afleiden uit de gegevens in de opdracht. 
check.expected-frequencies = Verbeter de verwachte frequenties. Zoek eventueel nog even op hoe je ze berekent.  